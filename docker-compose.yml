version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: agent_monitor_db
    environment:
      POSTGRES_USER: agentmonitor
      POSTGRES_PASSWORD: agentmonitor
      POSTGRES_DB: agent_monitor
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
